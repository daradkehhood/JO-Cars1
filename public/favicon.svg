<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1d23"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#e8c547"/>
      <stop offset="30%" stop-color="#d4a532"/>
      <stop offset="60%" stop-color="#c9952a"/>
      <stop offset="100%" stop-color="#a07820"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d870"/>
      <stop offset="50%" stop-color="#d4a532"/>
      <stop offset="100%" stop-color="#b8891e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a532" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#c9952a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d4a532" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shieldShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#d4a532" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- Outer ring glow -->
  <circle cx="128" cy="118" r="95" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.5"/>
  <circle cx="128" cy="118" r="88" fill="none" stroke="url(#ring)" stroke-width="0.8" opacity="0.3"/>

  <!-- Shield shape -->
  <path d="M128 30 L195 55 L195 120 Q195 170 128 205 Q61 170 61 120 L61 55 Z" 
        fill="none" stroke="url(#gold)" stroke-width="3" filter="url(#shieldShadow)"/>
  <path d="M128 38 L190 60 L190 118 Q190 164 128 197 Q66 164 66 118 L66 60 Z" 
        fill="#161920" stroke="url(#goldLight)" stroke-width="1.5" opacity="0.9"/>

  <!-- JO text inside shield -->
  <text x="128" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" 
        font-weight="900" font-size="80" fill="url(#gold)" filter="url(#glow)"
        letter-spacing="-2">JO</text>

  <!-- JO CARS text below shield -->
  <text x="128" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" 
        font-weight="700" font-size="22" fill="url(#goldLight)" letter-spacing="6">JO CARS</text>

  <!-- Decorative dots on ring -->
  <circle cx="128" cy="24" r="2" fill="#d4a532" opacity="0.6"/>
  <circle cx="128" cy="212" r="2" fill="#d4a532" opacity="0.6"/>
  <circle cx="34" cy="118" r="2" fill="#d4a532" opacity="0.6"/>
  <circle cx="222" cy="118" r="2" fill="#d4a532" opacity="0.6"/>
</svg>